name: shortynah

x-api-image: &api-image
  build:
    context: .
    dockerfile: docker/api/Dockerfile
  image: shortynah-api:${IMAGE_TAG:-dev}

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_NAME: ${APP_NAME:-Shorty-Nah}
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  OCTANE_SERVER: frankenphp
  OCTANE_WORKERS: ${OCTANE_WORKERS:-auto}
  OCTANE_MAX_REQUESTS: ${OCTANE_MAX_REQUESTS:-500}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:?CLICKHOUSE_DATABASE is required}
  CLICKHOUSE_WRITE_USERNAME: ${CLICKHOUSE_WRITE_USERNAME:?CLICKHOUSE_WRITE_USERNAME is required}
  CLICKHOUSE_WRITE_PASSWORD: ${CLICKHOUSE_WRITE_PASSWORD:?CLICKHOUSE_WRITE_PASSWORD is required}
  CLICKHOUSE_READ_USERNAME: ${CLICKHOUSE_READ_USERNAME:?CLICKHOUSE_READ_USERNAME is required}
  CLICKHOUSE_READ_PASSWORD: ${CLICKHOUSE_READ_PASSWORD:?CLICKHOUSE_READ_PASSWORD is required}
  GEOIP_PATH: /geoip
  # Host-mounted so the token survives a rotated container log. The directory is
  # a bind mount; the file itself is written 0600.
  SETUP_TOKEN_PATH: /var/lib/shortynah/setup/setup-token
  # Same variable as the network subnet below: the application must trust
  # exactly the network the edge sits on, and never a wildcard.
  TRUSTED_PROXIES: ${INTERNAL_SUBNET:-172.29.0.0/16}

x-api-depends: &api-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  # Nothing serves traffic against a schema that has not been applied. The
  # schema service runs to completion first, which is what makes a version
  # deploy safe: new code never meets an old table.
  schema:
    condition: service_completed_successfully

services:
  # A one-shot: applies both stores' schema, then exits. Every long-running
  # application service waits for it to succeed.
  schema:
    <<: *api-image
    command: ["schema"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
      - ${SETUP_TOKEN_DIR:-./run}:/var/lib/shortynah/setup

  edge:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  api:
    <<: *api-image
    restart: unless-stopped
    depends_on: *api-depends
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
      - geoip-data:/geoip:ro
      - ${SETUP_TOKEN_DIR:-./run}:/var/lib/shortynah/setup

  worker:
    <<: *api-image
    command: ["worker"]
    restart: unless-stopped
    # SIGTERM, then this long to finish in flight. Longer than the longest job
    # timeout, so a running job completes rather than being killed and retried.
    stop_signal: SIGTERM
    stop_grace_period: 120s
    depends_on: *api-depends
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
      - geoip-data:/geoip:ro
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  clicks:
    <<: *api-image
    command: ["clicks"]
    restart: unless-stopped
    # SIGTERM, then this long to finish in flight. Longer than the longest job
    # timeout, so a running job completes rather than being killed and retried.
    stop_signal: SIGTERM
    stop_grace_period: 45s
    depends_on: *api-depends
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
      - geoip-data:/geoip:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan shortynah:drain-clicks' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  scheduler:
    <<: *api-image
    command: ["scheduler"]
    restart: unless-stopped
    # SIGTERM, then this long to finish in flight. Longer than the longest job
    # timeout, so a running job completes rather than being killed and retried.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on: *api-depends
    environment: *api-env
    volumes:
      - api-storage:/app/storage/app
      - geoip-data:/geoip:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan schedule:work' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: shortynah-web:${IMAGE_TAG:-dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      INTERNAL_API_URL: http://api:8000

  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Without this the image initialises with trust authentication.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine@sha256:a4e8cf46e526a06f4f52d22f7fa8d07472b55d3c896d7ca3f159e249be38ae62
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:?CLICKHOUSE_DATABASE is required}
      CLICKHOUSE_USER: ${CLICKHOUSE_WRITE_USERNAME:?CLICKHOUSE_WRITE_USERNAME is required}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_WRITE_PASSWORD:?CLICKHOUSE_WRITE_PASSWORD is required}
      CLICKHOUSE_READ_USERNAME: ${CLICKHOUSE_READ_USERNAME:?CLICKHOUSE_READ_USERNAME is required}
      CLICKHOUSE_READ_PASSWORD: ${CLICKHOUSE_READ_PASSWORD:?CLICKHOUSE_READ_PASSWORD is required}
      # Required so the init script may create the read-only account.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/init-users.sh:/docker-entrypoint-initdb.d/init-users.sh:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  geoipupdate:
    image: maxmindinc/geoipupdate:v7@sha256:faecdca22579730ab0b7dea5aa9af350bb3c93cb9d39845c173639ead30346d2
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: ${MAXMIND_EDITION_IDS:-GeoLite2-City GeoLite2-ASN}
      GEOIPUPDATE_FREQUENCY: "72"
    volumes:
      - geoip-data:/usr/share/GeoIP

networks:
  default:
    ipam:
      config:
        # Pinned so the trusted-proxy list is deterministic rather than
        # whatever Docker happened to allocate. Override INTERNAL_SUBNET if it
        # collides with another network on the host.
        - subnet: ${INTERNAL_SUBNET:-172.29.0.0/16}

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
  geoip-data:
  api-storage:
