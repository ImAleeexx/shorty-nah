# Accepted image findings, one at a time and with a reason.
#
# Nothing here is ignored because it was inconvenient. Each entry cannot be acted
# on from this repository, and each says why and when it expires. The one
# standing policy exclusion — kernel headers, which describe a kernel a container
# does not run — lives in scripts/scan-images.sh, because it is about a package
# rather than a list of identifiers that would be stale within a week.
vulnerabilities:
  # Go modules compiled into the FrankenPHP binary. They are fixed upstream but
  # the newest published FrankenPHP image still carries the old versions, so
  # there is no digest this repository could pin that resolves them. Revisited
  # on expiry rather than forgotten.
