name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, pdo_pgsql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - run: composer validate --strict --no-check-publish
      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Formatting
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: ./vendor/bin/pest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test --run

      - name: Build
        run: pnpm build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Base images are digest-pinned
        run: ./scripts/check-image-pins.sh

      - name: Compose files are valid
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://example.test
          APP_DOMAIN: example.test
          NEXT_PUBLIC_APP_URL: https://example.test
          CADDY_ACME_EMAIL: ci@example.test
          DB_DATABASE: shortynah
          DB_USERNAME: shortynah
          DB_PASSWORD: ci
          REDIS_PASSWORD: ci
          CLICKHOUSE_DATABASE: shortynah_events
          CLICKHOUSE_WRITE_USERNAME: w
          CLICKHOUSE_WRITE_PASSWORD: ci
          CLICKHOUSE_READ_USERNAME: r
          CLICKHOUSE_READ_PASSWORD: ci

      - name: Caddy configuration is valid
        run: |
          docker run --rm -v "$PWD/docker/caddy/Caddyfile:/f:ro" \
            -e APP_DOMAIN=example.test -e CADDY_ACME_EMAIL=ci@example.test \
            caddy:2-alpine caddy validate --config /f --adapter caddyfile
          docker run --rm -v "$PWD/docker/caddy/Caddyfile.dev:/f:ro" \
            caddy:2-alpine caddy validate --config /f --adapter caddyfile

  # The Playwright suite needs the full Compose stack (edge, API, datastores),
  # so it joins CI once the setup flow it drives exists in phase 13.
