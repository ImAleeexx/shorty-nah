name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    # The ClickHouse-backed tests run against the real service rather than
    # skipping, so a regression in the client cannot pass CI unnoticed. Port
    # 8124 matches .env.example and the dev stack.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.3-alpine@sha256:a4e8cf46e526a06f4f52d22f7fa8d07472b55d3c896d7ca3f159e249be38ae62
        env:
          CLICKHOUSE_DB: shortynah_events
          CLICKHOUSE_USER: shortynah_writer
          CLICKHOUSE_PASSWORD: ci-writer
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8124:8123
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, pdo_pgsql, redis, sockets, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - run: composer validate --strict --no-check-publish
      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "CLICKHOUSE_WRITE_USERNAME=shortynah_writer"
            echo "CLICKHOUSE_WRITE_PASSWORD=ci-writer"
            echo "CLICKHOUSE_READ_USERNAME=shortynah_reader"
            echo "CLICKHOUSE_READ_PASSWORD=ci-reader"
            echo "TRUSTED_PROXIES=172.29.0.0/16"
          } >> .env

      - name: Create the ClickHouse read-only account
        run: |
          curl -sS --fail-with-body \
            --user "shortynah_writer:ci-writer" \
            --data-binary "CREATE USER IF NOT EXISTS shortynah_reader IDENTIFIED BY 'ci-reader'" \
            "http://127.0.0.1:8124/"
          curl -sS --fail-with-body \
            --user "shortynah_writer:ci-writer" \
            --data-binary "GRANT SELECT ON shortynah_events.* TO shortynah_reader" \
            "http://127.0.0.1:8124/"

      - name: Fail if any ClickHouse test skipped
        run: |
          ./vendor/bin/pest --filter=ClickHouse --log-junit /tmp/ch.xml > /dev/null 2>&1 || true
          if grep -q '<skipped' /tmp/ch.xml; then
            echo "ClickHouse tests skipped; the service was not reachable." >&2
            exit 1
          fi

      - name: Syntax
        # Runs before anything else: a file that will not compile makes every
        # later step's result meaningless, and the test runner reports nothing
        # at all when it happens.
        working-directory: .
        run: ./scripts/lint-php-syntax.sh

      - name: Formatting
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: ./vendor/bin/pest

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint CSS
        # The motion contract in stylesheets: ESLint cannot see CSS, so the same
        # rules are enforced by stylelint.
        run: pnpm lint:css

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test --run

      - name: Build
        run: pnpm build

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Base images are digest-pinned
        run: ./scripts/check-image-pins.sh

      - name: Compose files are valid
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: https://example.test
          APP_DOMAIN: example.test
          NEXT_PUBLIC_APP_URL: https://example.test
          CADDY_ACME_EMAIL: ci@example.test
          DB_DATABASE: shortynah
          DB_USERNAME: shortynah
          DB_PASSWORD: ci
          REDIS_PASSWORD: ci
          CLICKHOUSE_DATABASE: shortynah_events
          CLICKHOUSE_WRITE_USERNAME: w
          CLICKHOUSE_WRITE_PASSWORD: ci
          CLICKHOUSE_READ_USERNAME: r
          CLICKHOUSE_READ_PASSWORD: ci

      - name: Caddy configuration is valid
        run: |
          docker run --rm -v "$PWD/docker/caddy/Caddyfile:/f:ro" \
            -e APP_DOMAIN=example.test -e CADDY_ACME_EMAIL=ci@example.test \
            caddy:2-alpine caddy validate --config /f --adapter caddyfile
          docker run --rm -v "$PWD/docker/caddy/Caddyfile.dev:/f:ro" \
            caddy:2-alpine caddy validate --config /f --adapter caddyfile

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Secret scanning reads history: a credential removed in a later
          # commit is still a leaked credential.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/web

      - name: Dependency advisories
        run: ./scripts/scan-dependencies.sh

      - name: Committed secrets
        run: ./scripts/scan-secrets.sh

      - name: Base images are digest-pinned
        run: ./scripts/check-image-pins.sh

      - name: Build the images to scan
        run: |
          docker build -f docker/api/Dockerfile --target runtime -t shortynah-api:dev .
          docker build -f docker/web/Dockerfile --target runtime -t shortynah-web:dev .

      - name: Image vulnerabilities
        run: ./scripts/scan-images.sh

      - name: Images carry no instance secrets
        run: ./scripts/check-image-secrets.sh

  # The Playwright suite needs the full Compose stack (edge, API, datastores),
  # so it joins CI once the setup flow it drives exists in phase 13.
